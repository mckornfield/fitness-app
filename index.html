<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MattK's Workout App</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <div class="status-section">
        <p>Current Workout: <span id="current-workout"></span> <span id="round-counter"></span></p>
        <p>Time Left: <span id="time-left"></span></p>
    </div>

    <div class="controls-section">
        <div class="input-row">
            <label>Rest: <input id="rest" type="number" size="4" value="0"></label>
            <label>Rounds: <input id="rounds" type="number" size="4" value="0"></label>
        </div>
        <div class="button-row">
            <button id="play-button">Play</button>
            <button id="reset-button">Reset</button>
        </div>
    </div>

    <table id="exercise-table">
        <tr>
            <th>Exercise</th>
            <th>Seconds</th>
            <th></th>
        </tr>
        <tbody id="table-body">
            <tr>
                <td width="80%" contenteditable='true'>Burpees</td>
                <td contenteditable='true'>3</td>
                <td class="read-only-cell"><a class="row-remove" href="javascript:void(0);">X</a></td>
            </tr>
            <tr>
                <td width="80%" contenteditable='true'>Sit ups</td>
                <td contenteditable='true'>3</td>
                <td class="read-only-cell"><a class="row-remove" href="javascript:void(0);">X</a></td>
            </tr>
        </tbody>
    </table>
    <textarea id="bulk-edit-textarea" style="display: none;"></textarea>
    <div class="action-buttons">
        <button id="edit-button">Edit</button>
        <button id="add-button">+Add Row</button>
        <button id="bulk-edit-button">Bulk Edit</button>
    </div>
    <div class="save-section">
        <button id="save-button">Save</button>
    </div>
</body>
<script src="runFitness.js"></script>
<script src="fitnessGridCrud.js"></script>
<script src="saveProgram.js"></script>

<link rel="stylesheet" href="fitness.css">
